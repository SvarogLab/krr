[package]
name = "krr"
version = "0.1.0"
edition = "2024"
description = "Kubernetes Resource Recommender: right-size requests and limits from Prometheus usage data"
license = "MIT"
repository = "https://github.com/SvarogLab/krr"

[dependencies]
anyhow = "1.0.105"
clap = { version = "4.6.9", features = ["derive", "env"] }
comfy-table = { version = "8.0.1", features = ["custom_styling"] }
csv = "1.4.0"
futures = "0.3.34"
http = "1.5.0"
indicatif = "0.18.6"
jiff = "1.0.2"
k8s-openapi = { version = "0.29.0", features = ["latest"] }
kube = { version = "5.1.0", default-features = false, features = ["client", "config", "derive", "rustls-tls"] }
maud = "0.27.0"
owo-colors = "4.4.0"
percent-encoding = "2.3.2"
regex = "1.13.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
strip-ansi-escapes = "0.2.1"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time", "sync", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
yaml_serde = "0.10.7"

[dev-dependencies]
rcgen = "0.14.10"
tempfile = "3.27.0"
tokio-rustls = "0.26.6"
wiremock = "0.6.5"

[lints.clippy]
# A module with submodules lives in `name.rs` beside `name/`, not in `name/mod.rs`.
mod_module_files = "warn"
# Pedantic lints taken one by one: each enforces an idiom of current Rust.
duration_suboptimal_units = "warn"
manual_let_else = "warn"
uninlined_format_args = "warn"
